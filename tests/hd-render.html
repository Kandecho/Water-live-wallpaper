<!doctype html><html><meta charset="utf-8"><title>Water HD rendering checks</title>
<style>html,body{margin:0}canvas{display:block;width:100%;height:100%}iframe{border:0}#controls{display:none}#results{font:16px monospace;white-space:pre-wrap}</style>
<body><script>
if(!location.search){
  const sizes=[[1280,720],[480,800],[2560,720],[3840,2160]],results=document.createElement('pre'),frame=document.createElement('iframe');
  results.id='results';document.body.append(results,frame);let index=0;
  function next(){if(index===sizes.length){frame.remove();results.textContent+='DONE\n';return;}
    const [w,h]=sizes[index++];frame.width=w;frame.height=h;frame.src='?case='+w+'x'+h;}
  window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;results.textContent+=e.data+'\n';next();});next();
}else{
  document.documentElement.style.height=document.body.style.height='100%';
  document.body.innerHTML='<canvas id="water"></canvas><p id="error" hidden></p><aside id="controls"><div id="feature-controls"></div><span id="fps"></span></aside>';
  const canvas=document.getElementById('water'),gl=canvas.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false});
  let frames=0,white=0,reported=false,arrays=0;const originalDraw=gl.drawElements.bind(gl),originalArrays=gl.drawArrays.bind(gl);
  gl.drawElements=function(...args){
    originalDraw(...args);arrays=0;
  };
  gl.drawArrays=function(...args){
    originalArrays(...args);if(++arrays!==42)return;
    const w=canvas.width,h=canvas.height,n=6;
    for(const [x,y,width,height]of[[0,0,n,h],[w-n,0,n,h],[0,0,w,n],[0,h-n,w,n]]){
      const pixels=new Uint8Array(width*height*4);gl.readPixels(x,y,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
      for(let i=0;i<pixels.length;i+=4)if(Math.min(pixels[i],pixels[i+1],pixels[i+2])>245)white++;
    }
    if(++frames===36){reported=true;window.wallpaperPropertyListener.setPaused(true);
      const error=gl.getError();parent.postMessage(`${white||error?'FAIL':'PASS'} ${innerWidth}x${innerHeight}: ${white} white border pixels / ${frames} complete frames (including menisci); GL error ${error}`,location.origin);}
  };
  async function load(src){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+'?check='+Date.now();s.onload=resolve;s.onerror=reject;document.body.append(s);});}
  (async()=>{
    await load('../wallpaper-hd/assets.js');await load('../wallpaper-hd/maps.js');await load('../wallpaper-hd/settings.js');await load('../wallpaper-hd/wind.js');await load('../wallpaper-hd/world.js');
    const Original=WaterHD.World;
    WaterHD.World=class extends Original{
      constructor(aspect){
        super(aspect,()=>.42);
        this.triggerBreeze('strong');
        for(let i=0;i<4;i++){this.leaves[i].x=(i%2?1:-1)*(this.width/2-.02);this.leaves[i].y=(i<2?1:-1)*(this.height/2-.02);}
      }
      update(){}
      mesh(){
        const age=.25+(frames%18)*.12;
        this.time=WaterSettings.wind.gusts.strong.duration/2+age;this.waves=[];
        for(const [u,v]of[[.99,.5],[.01,.5],[.5,.01],[.5,.99],[.98,.02],[.02,.98]]){
          this.drop(u,v,frames<18?1:.2);this.waves[this.waves.length-1].born=this.time-age;
        }
        return super.mesh();
      }
    };
    await load('../wallpaper-hd/shaders.js');await load('../wallpaper-hd/renderer.js');await load('../wallpaper-hd/app.js');
  })().catch(e=>{reported=true;parent.postMessage('ERROR '+e,location.origin);});
  setTimeout(()=>{if(!reported)parent.postMessage('ERROR timeout: '+document.getElementById('error').textContent,location.origin);},15000);
}
</script></body></html>
